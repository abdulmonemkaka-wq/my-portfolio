<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المهارات والأدوات | عبدالمنعم محمد قاقا</title>

    <meta name="description"
        content="المهارات والأدوات التسويقية والتحليلية التي يعتمد عليها عبدالمنعم قاقا.">

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


    <style>

        /* =====================================================
           VARIABLES
        ===================================================== */

        :root {
            --white: #ffffff;
            --blue: #007BFF;
            --navy-blue: #0A2540;
            --light-gray: #F4F7F6;
            --text-dark: #333333;
            --text-muted: #64748B;
            --border: rgba(10, 37, 64, 0.08);

            --shadow-sm:
                0 8px 25px rgba(10, 37, 64, 0.06);

            --shadow-md:
                0 18px 50px rgba(10, 37, 64, 0.10);

            --shadow-blue:
                0 12px 30px rgba(0, 123, 255, 0.18);

            --radius: 18px;

            --transition:
                0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                radial-gradient(
                    circle at 85% 10%,
                    rgba(0, 123, 255, 0.045),
                    transparent 30%
                ),
                var(--light-gray);

            color: var(--text-dark);

            line-height: 1.7;

            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;

            background:
                rgba(255, 255, 255, 0.90);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border-bottom:
                1px solid rgba(10, 37, 64, 0.06);
        }


        .nav-container {
            max-width: 1250px;
            min-height: 76px;

            margin: auto;
            padding: 0 28px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 30px;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {
            position: relative;

            color: var(--navy-blue);

            font-size: 1.35rem;
            font-weight: 800;

            letter-spacing: -0.5px;

            white-space: nowrap;
        }


        .logo::after {
            content: "";

            display: inline-block;

            width: 7px;
            height: 7px;

            margin-right: 6px;

            background: var(--blue);

            border-radius: 50%;

            vertical-align: middle;
        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
        }


        .nav-links a {
            position: relative;

            padding: 10px 13px;

            color: #536274;

            font-size: 0.9rem;
            font-weight: 600;

            border-radius: 10px;

            transition: var(--transition);
        }


        .nav-links a::after {
            content: "";

            position: absolute;

            right: 13px;
            left: 13px;
            bottom: 5px;

            height: 2px;

            background: var(--blue);

            transform: scaleX(0);

            transition: var(--transition);
        }


        .nav-links a:hover {
            color: var(--navy-blue);

            background:
                rgba(0, 123, 255, 0.045);
        }


        .nav-links a:hover::after {
            transform: scaleX(1);
        }


        /* الصفحة الحالية */

        .nav-links a[href="skills.html"] {
            color: var(--blue);

            background:
                rgba(0, 123, 255, 0.06);
        }


        .nav-links a[href="skills.html"]::after {
            transform: scaleX(1);
        }


        /* =====================================================
           MOBILE MENU
        ===================================================== */

        .menu-toggle {
            display: none;

            color: var(--navy-blue);

            font-size: 1.35rem;

            cursor: pointer;

            padding: 9px;

            border-radius: 10px;

            transition: var(--transition);
        }


        .menu-toggle:hover {
            background: var(--light-gray);
            color: var(--blue);
        }


        /* =====================================================
           PAGE HEADER
        ===================================================== */

        .page-header {
            position: relative;

            overflow: hidden;

            padding:
                75px 20px 80px;

            text-align: center;

            color: var(--white);

            background:
                linear-gradient(
                    135deg,
                    var(--navy-blue),
                    #0d3153
                );
        }


        .page-header::before {
            content: "";

            position: absolute;

            width: 360px;
            height: 360px;

            top: -220px;
            right: -100px;

            border-radius: 50%;

            background:
                rgba(0, 123, 255, 0.13);
        }


        .page-header::after {
            content: "";

            position: absolute;

            width: 260px;
            height: 260px;

            bottom: -180px;
            left: -80px;

            border-radius: 50%;

            border:
                1px solid rgba(255, 255, 255, 0.08);
        }


        .page-header h1 {
            position: relative;
            z-index: 1;

            color: var(--white);

            font-size:
                clamp(2.1rem, 5vw, 3.2rem);

            font-weight: 800;

            letter-spacing: -1px;

            margin-bottom: 10px;
        }


        .page-header h1::after {
            content: "";

            display: block;

            width: 45px;
            height: 3px;

            margin: 12px auto 15px;

            background: var(--blue);

            border-radius: 20px;
        }


        .page-header p {
            position: relative;
            z-index: 1;

            color:
                rgba(255, 255, 255, 0.72);

            font-size: 1rem;
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .container {
            max-width: 1250px;

            margin: 0 auto;

            padding:
                60px 28px 90px;

            min-height: 50vh;
        }


        /* =====================================================
           SECTION TITLE
        ===================================================== */

        .section-title {
            position: relative;

            display: flex;
            align-items: center;

            gap: 13px;

            color: var(--navy-blue);

            font-size: 1.55rem;

            font-weight: 800;

            margin:
                10px 0 25px;

            padding-right: 17px;
        }


        .section-title::before {
            content: "";

            position: absolute;

            right: 0;

            width: 4px;
            height: 32px;

            border-radius: 10px;

            background: var(--blue);
        }


        .section-title:not(:first-child) {
            margin-top: 65px;
        }


        /* =====================================================
           GRID
        ===================================================== */

        .grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 20px;
        }


        /* =====================================================
           SKILL CARD
        ===================================================== */

        .skill-card {
            position: relative;

            min-width: 0;

            display: flex;

            align-items: center;

            gap: 18px;

            padding: 21px;

            background: var(--white);

            border:
                1px solid var(--border);

            border-radius: var(--radius);

            box-shadow: var(--shadow-sm);

            overflow: hidden;

            transition:
                transform var(--transition),
                box-shadow var(--transition),
                border-color var(--transition);
        }


        .skill-card::before {
            content: "";

            position: absolute;

            right: 0;
            top: 0;
            bottom: 0;

            width: 3px;

            background: var(--blue);

            transform: scaleY(0);

            transform-origin: center;

            transition:
                transform var(--transition);
        }


        .skill-card:hover {
            transform:
                translateY(-6px);

            border-color:
                rgba(0, 123, 255, 0.15);

            box-shadow:
                var(--shadow-md);
        }


        .skill-card:hover::before {
            transform: scaleY(1);
        }


        /* =====================================================
           SKILL ICON
        ===================================================== */

        .skill-icon {
            position: relative;

            width: 62px;
            height: 62px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 123, 255, 0.10),
                    rgba(0, 123, 255, 0.04)
                );

            border:
                1px solid rgba(0, 123, 255, 0.08);

            transition:
                transform var(--transition),
                background var(--transition);
        }


        .skill-card:hover .skill-icon {
            transform:
                scale(1.06);

            background:
                rgba(0, 123, 255, 0.12);
        }


        .skill-icon img {
            width: 38px;
            height: 38px;

            object-fit: contain;
        }


        .skill-icon i {
            color: var(--blue);

            font-size: 1.75rem;
        }


        /* =====================================================
           SKILL INFO
        ===================================================== */

        .skill-info {
            min-width: 0;
        }


        .skill-info h3 {
            color: var(--navy-blue);

            font-size: 1.05rem;

            font-weight: 800;

            line-height: 1.5;

            margin-bottom: 5px;
        }


        .skill-info p {
            color: var(--text-muted);

            font-size: 0.84rem;

            line-height: 1.7;

            display: -webkit-box;

            -webkit-line-clamp: 2;

            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        /* =====================================================
           STATE MESSAGE
        ===================================================== */

        .state-msg {
            grid-column: 1 / -1;

            min-height: 190px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 7px;

            padding: 30px;

            text-align: center;

            color: var(--text-muted);

            background: var(--white);

            border:
                1px solid var(--border);

            border-radius: var(--radius);

            box-shadow: var(--shadow-sm);
        }


        .state-msg i {
            margin-bottom: 5px;

            color: var(--blue);

            font-size: 1.8rem;
        }


        .state-msg strong {
            color: var(--navy-blue);

            font-size: 1rem;
        }


        .state-msg span {
            font-size: 0.82rem;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            position: relative;

            overflow: hidden;

            background: var(--navy-blue);

            color: var(--white);

            padding:
                45px 20px 25px;

            text-align: center;
        }


        footer::before {
            content: "";

            position: absolute;

            width: 280px;
            height: 280px;

            top: -180px;
            right: -100px;

            border-radius: 50%;

            background:
                rgba(0, 123, 255, 0.12);
        }


        .social-links {
            position: relative;
            z-index: 1;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-bottom: 18px;
        }


        .social-links a {
            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: var(--white);

            background:
                rgba(255, 255, 255, 0.07);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 12px;

            font-size: 1.15rem;

            transition: var(--transition);
        }


        .social-links a:hover {
            color: var(--white);

            background: var(--blue);

            transform:
                translateY(-3px);

            box-shadow:
                0 8px 20px rgba(0, 123, 255, 0.25);
        }


        footer > p {
            position: relative;
            z-index: 1;

            color:
                rgba(255, 255, 255, 0.62);

            font-size: 0.84rem;
        }


        .admin-link {
            position: absolute;

            left: 20px;
            bottom: 20px;

            color:
                rgba(255, 255, 255, 0.18);

            font-size: 11px;

            transition: var(--transition);
        }


        .admin-link:hover {
            color: var(--white);
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1050px) {

            .nav-container {
                padding: 0 22px;
            }


            .nav-links {
                gap: 2px;
            }


            .nav-links a {
                padding: 9px;

                font-size: 0.82rem;
            }


            .grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }
        }


        @media (max-width: 768px) {

            .nav-container {
                min-height: 68px;

                padding: 0 18px;
            }


            .logo {
                font-size: 1.15rem;
            }


            .menu-toggle {
                display: block;
            }


            .nav-links {
                position: absolute;

                top:
                    calc(100% + 1px);

                right: 12px;
                left: 12px;

                display: none;

                flex-direction: column;

                align-items: stretch;

                gap: 3px;

                padding: 10px;

                background:
                    rgba(255, 255, 255, 0.97);

                backdrop-filter:
                    blur(15px);

                border:
                    1px solid rgba(10, 37, 64, 0.07);

                border-radius: 16px;

                box-shadow:
                    0 20px 50px
                    rgba(10, 37, 64, 0.12);
            }


            .nav-links.active {
                display: flex;
            }


            .nav-links a {
                padding:
                    12px 15px;

                text-align: right;
            }


            .nav-links a::after {
                display: none;
            }


            .page-header {
                padding:
                    55px 20px 60px;
            }


            .page-header h1 {
                font-size: 2.2rem;
            }


            .container {
                padding:
                    45px 18px 65px;
            }


            .section-title {
                font-size: 1.35rem;
            }


            .section-title:not(:first-child) {
                margin-top: 50px;
            }


            .grid {
                grid-template-columns: 1fr;

                gap: 16px;
            }


            .skill-card {
                padding: 18px;
            }
        }


        @media (max-width: 420px) {

            .page-header h1 {
                font-size: 2rem;
            }


            .page-header p {
                font-size: 0.88rem;
            }


            .skill-icon {
                width: 56px;
                height: 56px;
            }


            .skill-icon img {
                width: 34px;
                height: 34px;
            }


            .skill-info h3 {
                font-size: 0.98rem;
            }


            .skill-info p {
                font-size: 0.79rem;
            }
        }


        @media (prefers-reduced-motion: reduce) {

            * {
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }

    </style>

</head>

    <script type="module">

        import { db }
            from './firebase-config.js';


        import {
            collection,
            query,
            orderBy,
            onSnapshot
        }
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";


        /* =====================================================
           CACHE
        ===================================================== */

        const CACHE_KEY =
            "portfolio_skills_tools_cache_v1";


        /* =====================================================
           DOM
        ===================================================== */

        const skillsBox =
            document.getElementById("skillsContainer");


        const toolsBox =
            document.getElementById("toolsContainer");


        const mobileMenu =
            document.getElementById("mobile-menu");


        const navLinks =
            document.getElementById("nav-links");


        /* =====================================================
           MOBILE MENU
        ===================================================== */

        mobileMenu.addEventListener("click", () => {

            navLinks.classList.toggle("active");


            if (navLinks.classList.contains("active")) {

                mobileMenu.classList.remove("fa-bars");

                mobileMenu.classList.add("fa-xmark");

            } else {

                mobileMenu.classList.remove("fa-xmark");

                mobileMenu.classList.add("fa-bars");

            }

        });


        document
            .querySelectorAll(".nav-links a")
            .forEach(link => {

                link.addEventListener("click", () => {

                    navLinks.classList.remove("active");

                    mobileMenu.classList.remove("fa-xmark");

                    mobileMenu.classList.add("fa-bars");

                });

            });


        /* =====================================================
           SECURITY
        ===================================================== */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* =====================================================
           ICON
        ===================================================== */

        function createIcon(icon, name) {

            if (!icon) {

                return `
                    <i
                        class="fas fa-check-circle"
                        aria-hidden="true">
                    </i>
                `;
            }


            const iconValue =
                String(icon).trim();


            const isUrl =
                iconValue.startsWith("http://") ||
                iconValue.startsWith("https://");


            if (isUrl) {

                return `

                    <img
                        src="${escapeHTML(iconValue)}"
                        alt="${escapeHTML(name)}"
                        loading="lazy"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                    >

                    <i
                        class="fas fa-check-circle"
                        style="display:none;"
                        aria-hidden="true">
                    </i>

                `;

            }


            return `

                <i
                    class="${escapeHTML(iconValue)}"
                    aria-hidden="true">
                </i>

            `;
        }


        /* =====================================================
           CREATE CARD
        ===================================================== */

        function createCard(data) {

            const name =
                escapeHTML(
                    data.name || "مهارة"
                );


            const description =
                escapeHTML(
                    data.description || ""
                );


            return `

                <article class="skill-card">

                    <div class="skill-icon">

                        ${createIcon(
                            data.icon,
                            data.name
                        )}

                    </div>


                    <div class="skill-info">

                        <h3>
                            ${name}
                        </h3>


                        ${
                            description
                            ?
                            `<p>${description}</p>`
                            :
                            ""
                        }

                    </div>

                </article>

            `;
        }


        /* =====================================================
           RENDER
        ===================================================== */

        function renderData(items) {

            let skillsHTML = "";

            let toolsHTML = "";

            let hasSkills = false;

            let hasTools = false;


            items.forEach(item => {

                const data = item.data || item;


                const type =
                    String(data.type || "")
                        .trim()
                        .toLowerCase();


                const card =
                    createCard(data);


                if (
                    type === "skill" ||
                    type === "مهارة" ||
                    type === "skills"
                ) {

                    skillsHTML += card;

                    hasSkills = true;

                } else {

                    toolsHTML += card;

                    hasTools = true;

                }

            });


            if (hasSkills) {

                skillsBox.innerHTML =
                    skillsHTML;

            } else {

                skillsBox.innerHTML = `

                    <div class="state-msg">

                        <i class="fa-solid fa-lightbulb"></i>

                        <strong>
                            لا توجد مهارات مضافة حاليًا
                        </strong>

                        <span>
                            سيتم عرض المهارات هنا عند إضافتها من لوحة التحكم
                        </span>

                    </div>

                `;

            }


            if (hasTools) {

                toolsBox.innerHTML =
                    toolsHTML;

            } else {

                toolsBox.innerHTML = `

                    <div class="state-msg">

                        <i class="fa-solid fa-toolbox"></i>

                        <strong>
                            لا توجد أدوات مضافة حاليًا
                        </strong>

                        <span>
                            سيتم عرض الأدوات هنا عند إضافتها من لوحة التحكم
                        </span>

                    </div>

                `;

            }

        }


        /* =====================================================
           SAVE CACHE
        ===================================================== */

        function saveCache(items) {

            try {

                localStorage.setItem(
                    CACHE_KEY,
                    JSON.stringify(items)
                );

            } catch (error) {

                console.warn(
                    "تعذر حفظ المهارات والأدوات:",
                    error
                );

            }

        }


        /* =====================================================
           LOAD CACHE
        ===================================================== */

        function loadCache() {

            try {

                const cached =
                    localStorage.getItem(
                        CACHE_KEY
                    );


                if (!cached) {

                    return false;

                }


                const items =
                    JSON.parse(cached);


                if (
                    Array.isArray(items) &&
                    items.length
                ) {

                    renderData(items);

                    return true;

                }

            } catch (error) {

                console.warn(
                    "تعذر قراءة Cache:",
                    error
                );

            }


            return false;

        }


        /* =====================================================
           FIREBASE REALTIME
        ===================================================== */

        function listenToFirebase() {

            const q =
                query(
                    collection(db, "skills"),
                    orderBy("order", "asc")
                );


            onSnapshot(

                q,

                snapshot => {

                    const items = [];


                    snapshot.forEach(doc => {

                        items.push({

                            id: doc.id,

                            data: doc.data()

                        });

                    });


                    /*
                       عرض البيانات فور وصول Firebase
                    */

                    renderData(items);


                    /*
                       حفظ آخر نسخة
                    */

                    saveCache(items);

                },


                error => {

                    console.error(
                        "Firebase skills error:",
                        error
                    );


                    /*
                       لو عندنا Cache،
                       نستمر في عرض البيانات
                       ولا نزعج المستخدم برسالة خطأ.
                    */

                    const cached =
                        localStorage.getItem(
                            CACHE_KEY
                        );


                    if (!cached) {

                        skillsBox.innerHTML = `

                            <div class="state-msg">

                                <i class="fa-solid fa-wifi"></i>

                                <strong>
                                    تعذر الاتصال بالبيانات
                                </strong>

                                <span>
                                    يرجى التأكد من الاتصال بالإنترنت والمحاولة مرة أخرى.
                                </span>

                            </div>

                        `;


                        toolsBox.innerHTML = `

                            <div class="state-msg">

                                <i class="fa-solid fa-wifi"></i>

                                <strong>
                                    تعذر الاتصال بالبيانات
                                </strong>

                                <span>
                                    يرجى التأكد من الاتصال بالإنترنت والمحاولة مرة أخرى.
                                </span>

                            </div>

                        `;

                    }

                }

            );

        }


        /* =====================================================
           START
        ===================================================== */

        /*
           أولًا:
           نحاول عرض البيانات من Cache فورًا.

           ثانيًا:
           نفتح اتصال Firebase في الخلفية.

           ثالثًا:
           أي تعديل في Dashboard
           يتم تحديثه تلقائيًا.
        */

        loadCache();

        listenToFirebase();

    </script>

</body>

</html>
