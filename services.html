<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الخدمات | عبدالمنعم محمد قاقا</title>

    <meta name="description"
        content="الخدمات التسويقية التي يقدمها عبدالمنعم محمد قاقا، أخصائي التسويق الرقمي.">

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


    <style>

        /* =====================================================
           VARIABLES
        ===================================================== */

        :root {

            --white: #ffffff;

            --blue: #007BFF;

            --navy-blue: #0A2540;

            --light-gray: #F4F7F6;

            --text-dark: #333333;

            --text-muted: #64748B;

            --border: rgba(10, 37, 64, 0.08);

            --shadow-sm:
                0 8px 25px rgba(10, 37, 64, 0.06);

            --shadow-md:
                0 18px 50px rgba(10, 37, 64, 0.10);

            --shadow-blue:
                0 12px 30px rgba(0, 123, 255, 0.20);

            --radius: 18px;

            --transition:
                0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            background:
                radial-gradient(
                    circle at 85% 10%,
                    rgba(0, 123, 255, 0.045),
                    transparent 30%
                ),
                var(--light-gray);

            color: var(--text-dark);

            line-height: 1.7;

            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            position: sticky;

            top: 0;

            z-index: 1000;

            background:
                rgba(255, 255, 255, 0.90);

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

            border-bottom:
                1px solid rgba(10, 37, 64, 0.06);
        }


        .nav-container {

            max-width: 1250px;

            min-height: 76px;

            margin: auto;

            padding: 0 28px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 30px;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {

            position: relative;

            color: var(--navy-blue);

            font-size: 1.35rem;

            font-weight: 800;

            letter-spacing: -0.5px;

            white-space: nowrap;
        }


        .logo::after {

            content: "";

            display: inline-block;

            width: 7px;

            height: 7px;

            margin-right: 6px;

            background: var(--blue);

            border-radius: 50%;

            vertical-align: middle;
        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .nav-links {

            display: flex;

            align-items: center;

            gap: 6px;
        }


        .nav-links a {

            position: relative;

            padding: 10px 13px;

            color: #536274;

            font-size: 0.9rem;

            font-weight: 600;

            border-radius: 10px;

            transition: var(--transition);
        }


        .nav-links a::after {

            content: "";

            position: absolute;

            right: 13px;

            left: 13px;

            bottom: 5px;

            height: 2px;

            background: var(--blue);

            transform: scaleX(0);

            transition: var(--transition);
        }


        .nav-links a:hover {

            color: var(--navy-blue);

            background:
                rgba(0, 123, 255, 0.045);
        }


        .nav-links a:hover::after {

            transform: scaleX(1);
        }


        /* Current page */

        .nav-links a[href="services.html"] {

            color: var(--blue);

            background:
                rgba(0, 123, 255, 0.06);
        }


        .nav-links a[href="services.html"]::after {

            transform: scaleX(1);
        }


        /* =====================================================
           MOBILE MENU
        ===================================================== */

        .menu-toggle {

            display: none;

            color: var(--navy-blue);

            font-size: 1.35rem;

            cursor: pointer;

            padding: 9px;

            border-radius: 10px;

            transition: var(--transition);
        }


        .menu-toggle:hover {

            background: var(--light-gray);

            color: var(--blue);
        }


        /* =====================================================
           PAGE HEADER
        ===================================================== */

        .page-header {

            position: relative;

            overflow: hidden;

            padding:
                75px 20px 80px;

            text-align: center;

            color: var(--white);

            background:
                linear-gradient(
                    135deg,
                    var(--navy-blue),
                    #0d3153
                );
        }


        .page-header::before {

            content: "";

            position: absolute;

            width: 360px;

            height: 360px;

            top: -220px;

            right: -100px;

            border-radius: 50%;

            background:
                rgba(0, 123, 255, 0.13);
        }


        .page-header::after {

            content: "";

            position: absolute;

            width: 260px;

            height: 260px;

            bottom: -180px;

            left: -80px;

            border-radius: 50%;

            border:
                1px solid rgba(255, 255, 255, 0.08);
        }


        .page-header h1 {

            position: relative;

            z-index: 1;

            margin-bottom: 10px;

            color: var(--white);

            font-size:
                clamp(2.1rem, 5vw, 3.2rem);

            font-weight: 800;

            letter-spacing: -1px;
        }


        .page-header h1::after {

            content: "";

            display: block;

            width: 45px;

            height: 3px;

            margin: 12px auto 15px;

            background: var(--blue);

            border-radius: 20px;
        }


        .page-header p {

            position: relative;

            z-index: 1;

            color:
                rgba(255, 255, 255, 0.72);

            font-size: 1rem;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .container {

            max-width: 1250px;

            margin: 0 auto;

            padding:
                65px 28px 90px;

            min-height: 50vh;
        }


        /* =====================================================
           SERVICES GRID
        ===================================================== */

        .grid {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 25px;
        }


        /* =====================================================
           SERVICE CARD
        ===================================================== */

        .card {

            position: relative;

            display: flex;

            flex-direction: column;

            min-width: 0;

            overflow: hidden;

            background: var(--white);

            border:
                1px solid var(--border);

            border-radius: var(--radius);

            box-shadow: var(--shadow-sm);

            transition:
                transform var(--transition),
                box-shadow var(--transition),
                border-color var(--transition);
        }


        .card:hover {

            transform:
                translateY(-7px);

            border-color:
                rgba(0, 123, 255, 0.15);

            box-shadow:
                var(--shadow-md);
        }


        /* =====================================================
           CARD IMAGE
        ===================================================== */

        .card-image {

            position: relative;

            width: 100%;

            height: 220px;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #eef6ff,
                    #f7fafc
                );
        }


        .card-image img {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

            transition:
                transform 0.6s ease;
        }


        .card:hover .card-image img {

            transform:
                scale(1.045);
        }


        /* Blue overlay */

        .card-image::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to top,
                    rgba(10, 37, 64, 0.18),
                    transparent 45%
                );

            pointer-events: none;
        }


        /* =====================================================
           CARD BODY
        ===================================================== */

        .card-body {

            display: flex;

            flex-direction: column;

            flex: 1;

            padding: 24px 23px 22px;
        }


        .card h3 {

            color: var(--navy-blue);

            font-size: 1.18rem;

            font-weight: 800;

            line-height: 1.5;

            margin-bottom: 10px;
        }


        .card p {

            color: var(--text-muted);

            font-size: 0.92rem;

            line-height: 1.9;

            margin-bottom: 22px;
        }


        /* =====================================================
           ORDER BUTTON
        ===================================================== */

        .service-order {

            width: 100%;

            margin-top: auto;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            min-height: 48px;

            padding: 11px 18px;

            color: var(--white);

            background: var(--blue);

            border: none;

            border-radius: 11px;

            font-family: 'Cairo', sans-serif;

            font-size: 0.9rem;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform var(--transition),
                background var(--transition),
                box-shadow var(--transition);
        }


        .service-order i {

            font-size: 1rem;
        }


        .service-order:hover {

            background: var(--navy-blue);

            transform:
                translateY(-2px);

            box-shadow:
                var(--shadow-blue);
        }


        .service-order:active {

            transform:
                translateY(0);
        }


        /* =====================================================
           EMPTY / ERROR STATE
        ===================================================== */

        .state-msg {

            grid-column:
                1 / -1;

            min-height: 260px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 35px;

            text-align: center;

            color: var(--text-muted);

            background: var(--white);

            border:
                1px solid var(--border);

            border-radius: var(--radius);

            box-shadow: var(--shadow-sm);
        }


        .state-msg i {

            margin-bottom: 14px;

            color: var(--blue);

            font-size: 2rem;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            position: relative;

            overflow: hidden;

            background: var(--navy-blue);

            color: var(--white);

            padding:
                45px 20px 25px;

            text-align: center;
        }


        footer::before {

            content: "";

            position: absolute;

            width: 280px;

            height: 280px;

            top: -180px;

            right: -100px;

            border-radius: 50%;

            background:
                rgba(0, 123, 255, 0.12);
        }


        footer p {

            position: relative;

            z-index: 1;

            color:
                rgba(255, 255, 255, 0.62);

            font-size: 0.85rem;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1050px) {

            .nav-container {

                padding:
                    0 22px;
            }


            .nav-links {

                gap: 2px;
            }


            .nav-links a {

                padding:
                    9px;

                font-size:
                    0.82rem;
            }


            .grid {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }
        }


        @media (max-width: 768px) {

            .nav-container {

                min-height: 68px;

                padding:
                    0 18px;
            }


            .logo {

                font-size:
                    1.15rem;
            }


            .menu-toggle {

                display: block;
            }


            .nav-links {

                position: absolute;

                top:
                    calc(100% + 1px);

                right: 12px;

                left: 12px;

                display: none;

                flex-direction: column;

                align-items: stretch;

                gap: 3px;

                padding: 10px;

                background:
                    rgba(255, 255, 255, 0.97);

                backdrop-filter:
                    blur(15px);

                border:
                    1px solid rgba(10, 37, 64, 0.07);

                border-radius: 16px;

                box-shadow:
                    0 20px 50px
                    rgba(10, 37, 64, 0.12);
            }


            .nav-links.active {

                display: flex;
            }


            .nav-links a {

                padding:
                    12px 15px;

                text-align:
                    right;
            }


            .nav-links a::after {

                display: none;
            }


            .page-header {

                padding:
                    55px 20px 60px;
            }


            .page-header h1 {

                font-size:
                    2.2rem;
            }


            .container {

                padding:
                    45px 18px 65px;
            }


            .grid {

                grid-template-columns:
                    1fr;

                gap: 20px;
            }


            .card-image {

                height:
                    210px;
            }
        }


        @media (max-width: 420px) {

            .page-header h1 {

                font-size:
                    2rem;
            }


            .page-header p {

                font-size:
                    0.88rem;
            }


            .card-image {

                height:
                    190px;
            }


            .card-body {

                padding:
                    21px 19px;
            }
        }


        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            * {

                transition:
                    none !important;

                scroll-behavior:
                    auto !important;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header>

        <div class="nav-container">

            <a href="index.html" class="logo">
                عبدالمنعم قاقا
            </a>


            <i
                class="fas fa-bars menu-toggle"
                id="mobile-menu"
                aria-label="فتح القائمة">
            </i>


            <nav class="nav-links" id="nav-links">

                <a href="index.html">
                    الرئيسية
                </a>

                <a href="services.html">
                    الخدمات
                </a>

                <a href="skills.html">
                    المهارات والأدوات
                </a>

                <a href="projects.html">
                    المشاريع
                </a>

                <a href="testimonials.html">
                    آراء العملاء
                </a>

                <a href="contact.html">
                    التواصل
                </a>

            </nav>

        </div>

    </header>


    <!-- =====================================================
         PAGE HEADER
    ===================================================== -->

    <section class="page-header">

        <h1>
            الخدمات
        </h1>

        <p>
            حلول تسويقية متكاملة مصممة لتحقيق أهدافك
        </p>

    </section>


    <!-- =====================================================
         SERVICES
    ===================================================== -->

    <main class="container">

        <div
            id="content"
            class="grid">
        </div>

    </main>


    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <footer>

        <p>
            جميع الحقوق محفوظة &copy; 2026
            عبدالمنعم محمد قاقا
        </p>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script type="module">

        import { db }
            from './firebase-config.js';


        import {
            collection,
            query,
            orderBy,
            onSnapshot
        }
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";


        /* =====================================================
           SETTINGS
        ===================================================== */

        const WHATSAPP_NUMBER = "201157865809";

        const CACHE_KEY = "portfolio_services_cache_v1";


        /* =====================================================
           DOM
        ===================================================== */

        const container =
            document.getElementById("content");

        const mobileMenu =
            document.getElementById("mobile-menu");

        const navLinks =
            document.getElementById("nav-links");


        /* =====================================================
           MOBILE MENU
        ===================================================== */

        mobileMenu.addEventListener("click", () => {

            navLinks.classList.toggle("active");


            if (navLinks.classList.contains("active")) {

                mobileMenu.classList.remove("fa-bars");

                mobileMenu.classList.add("fa-xmark");

            } else {

                mobileMenu.classList.remove("fa-xmark");

                mobileMenu.classList.add("fa-bars");

            }

        });


        /* Close menu after click */

        document
            .querySelectorAll(".nav-links a")
            .forEach(link => {

                link.addEventListener("click", () => {

                    navLinks.classList.remove("active");

                    mobileMenu.classList.remove("fa-xmark");

                    mobileMenu.classList.add("fa-bars");

                });

            });


        /* =====================================================
           ESCAPE HTML
           حماية البيانات القادمة من Firebase
        ===================================================== */

        function escapeHTML(value) {

            if (value === null || value === undefined) {

                return "";

            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* =====================================================
           ESCAPE ATTRIBUTE
        ===================================================== */

        function escapeAttribute(value) {

            return escapeHTML(value);
        }


        /* =====================================================
           CREATE WHATSAPP LINK
        ===================================================== */

        function createWhatsAppLink(serviceName) {

            const message =
                `السلام عليكم، أرغب في طلب خدمة: ${serviceName}`;

            return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
        }


        /* =====================================================
           DEFAULT IMAGE
        ===================================================== */

        const DEFAULT_IMAGE =
            "https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=900&q=80";


        /* =====================================================
           RENDER SERVICES
        ===================================================== */

        function renderServices(services) {

            if (!services || services.length === 0) {

                container.className = "grid";

                container.innerHTML = `

                    <div class="state-msg">

                        <i class="fa-solid fa-briefcase"></i>

                        <strong>
                            لا توجد خدمات مضافة حاليًا
                        </strong>

                        <span>
                            سيتم عرض الخدمات هنا عند إضافتها من لوحة التحكم
                        </span>

                    </div>

                `;

                return;
            }


            container.className = "grid";


            container.innerHTML = services
                .map(service => {

                    const name =
                        escapeHTML(service.name || "خدمة تسويقية");


                    const description =
                        escapeHTML(
                            service.description ||
                            "خدمة تسويقية احترافية مصممة لمساعدتك على تحقيق أهدافك."
                        );


                    const image =
                        escapeAttribute(
                            service.image || DEFAULT_IMAGE
                        );


                    const whatsapp =
                        createWhatsAppLink(
                            service.name || "الخدمة"
                        );


                    return `

                        <article class="card">

                            <div class="card-image">

                                <img
                                    src="${image}"
                                    alt="${name}"
                                    loading="lazy"
                                    onerror="this.src='${DEFAULT_IMAGE}'"
                                >

                            </div>


                            <div class="card-body">

                                <h3>
                                    ${name}
                                </h3>


                                <p>
                                    ${description}
                                </p>


                                <a
                                    href="${whatsapp}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="service-order"
                                >

                                    <i class="fab fa-whatsapp"></i>

                                    <span>
                                        اطلب الآن
                                    </span>

                                </a>

                            </div>

                        </article>

                    `;

                })
                .join("");
        }


        /* =====================================================
           SAVE CACHE
        ===================================================== */

        function saveToCache(services) {

            try {

                localStorage.setItem(
                    CACHE_KEY,
                    JSON.stringify(services)
                );

            } catch (error) {

                console.warn(
                    "تعذر حفظ الخدمات في التخزين المحلي",
                    error
                );

            }
        }


        /* =====================================================
           LOAD CACHE IMMEDIATELY
        ===================================================== */

        function loadFromCache() {

            try {

                const cached =
                    localStorage.getItem(CACHE_KEY);


                if (!cached) {

                    return false;

                }


                const services =
                    JSON.parse(cached);


                if (
                    Array.isArray(services) &&
                    services.length > 0
                ) {

                    renderServices(services);

                    return true;
                }

            } catch (error) {

                console.warn(
                    "تعذر قراءة Cache الخدمات",
                    error
                );

            }

            return false;
        }


        /* =====================================================
           FIREBASE REALTIME LISTENER
        ===================================================== */

        function listenToServices() {

            const servicesQuery =
                query(
                    collection(db, "services"),
                    orderBy("order", "asc")
                );


            onSnapshot(

                servicesQuery,

                (snapshot) => {

                    const services = [];


                    snapshot.forEach(doc => {

                        services.push({

                            id: doc.id,

                            ...doc.data()

                        });

                    });


                    /*
                       تحديث الصفحة فور وصول بيانات Firebase
                    */

                    renderServices(services);


                    /*
                       حفظ أحدث نسخة
                       للزيارة القادمة
                    */

                    saveToCache(services);

                },


                (error) => {

                    console.error(
                        "Firebase services error:",
                        error
                    );


                    /*
                       مهم:
                       لو عندنا Cache بالفعل،
                       لا نمسحه ولا نعرض رسالة خطأ للمستخدم.
                    */

                    const hasCache =
                        localStorage.getItem(CACHE_KEY);


                    if (!hasCache) {

                        container.innerHTML = `

                            <div class="state-msg">

                                <i class="fa-solid fa-wifi"></i>

                                <strong>
                                    تعذر الاتصال بالبيانات
                                </strong>

                                <span>
                                    يرجى التأكد من الاتصال بالإنترنت والمحاولة مرة أخرى.
                                </span>

                            </div>

                        `;

                    }

                }

            );

        }


        /* =====================================================
           START
        ===================================================== */

        /*
           1- عرض البيانات المخزنة فورًا
           2- بعدها الاستماع إلى Firebase
           3- Firebase يحدث البيانات تلقائيًا
        */

        loadFromCache();

        listenToServices();

    </script>


</body>

</html>
