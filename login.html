<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #007BFF; --navy-blue: #0A2540; --white: #fff; --gray: #f4f7f6; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background: var(--gray); display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: var(--white); padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-box h2 { color: var(--navy-blue); margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: right; }
        .input-group label { display: block; margin-bottom: 5px; color: #555; font-weight: 600; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        .input-group input:focus { border-color: var(--blue); }
        .btn { width: 100%; padding: 12px; background: var(--blue); color: var(--white); border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: var(--navy-blue); }
        .error { color: #dc3545; margin-top: 15px; font-size: 0.9rem; display: none; }
        .loading { display: none; color: var(--blue); margin-top: 10px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>تسجيل الدخول للإدارة</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">تسجيل الدخول</button>
            <div class="loading" id="loading">جاري تسجيل الدخول...</div>
            <div class="error" id="errorMsg"></div>
        </form>
    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'dashboard.html';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const loading = document.getElementById('loading');
            const btn = document.getElementById('loginBtn');

            errorMsg.style.display = 'none';
            loading.style.display = 'block';
            btn.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Redirect happens in onAuthStateChanged
            } catch (error) {
                loading.style.display = 'none';
                btn.disabled = false;
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'بيانات الدخول غير صحيحة.';
            }
        });
    </script>
</body>
</html>
